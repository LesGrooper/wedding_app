<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Undangan Pernikahan</title>
  <base href="/">

  <!-- Tandai acara (?acara=banjar / ?acara=cimahi) SEBELUM paint pertama,
       supaya tamu Cimahi tidak sempat melihat warna Banjar. Ini satu-satunya
       parser URL-nya: tema di styles.css dan EventService sama-sama membaca
       atribut data-acara ini. Nilai tak dikenal = tema default. -->
  <script>
    (function () {
      var m = /[?&]acara=([a-z]+)/i.exec(location.search);
      if (m) document.documentElement.setAttribute('data-acara', m[1].toLowerCase());
    })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="description" content="Undangan pernikahan — kehadiran Anda adalah kebahagiaan kami.">

  <!-- Ganti domain di og:url & og:image saat pindah ke domain asli.
       WhatsApp & Facebook tidak me-resolve path relatif pada og:image, jadi
       tanpa URL absolut kartu preview link tidak akan pernah muncul.
       Tag di bawah = preview acara default (Banjar). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Undangan Pernikahan">
  <meta property="og:locale" content="id_ID">
  <meta property="og:title" content="Undangan Pernikahan">
  <meta property="og:description" content="Kami mengundang Anda untuk hadir di hari bahagia kami.">
  <meta property="og:url" content="https://theday-rezkiayu.com/">
  <meta property="og:image" content="https://theday-rezkiayu.com/assets/images/og-cover.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Monogram R & A — undangan pernikahan">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Preview per acara (?acara=<kunci>). Crawler WhatsApp TIDAK menjalankan JS,
       jadi tag di atas tidak bisa diganti dari browser. Saat build,
       scripts/build-og-pages.mjs membuat <kunci>.html dari file ini dengan meta
       di blok ini menimpa meta bernama sama (og:image boleh path relatif — dibuat
       absolut dari og:url), dan vercel.json mengirim file itu untuk /?acara=<kunci>.
       Acara yang tidak tercantum memakai tag default di atas.
       Tambah acara di sini → tambah juga rewrite-nya di vercel.json (build gagal kalau lupa).
       Cover-nya dari `pnpm run icons` (OG_COVERS di scripts/generate-icons.mjs). -->
  <script type="application/json" id="og-acara">
    {
      "cimahi": {
        "og:title": "Undangan Ngunduh Mantu",
        "og:description": "Kami mengundang Anda untuk hadir di acara ngunduh mantu kami.",
        "og:image": "assets/images/og-cover-cimahi.jpg",
        "og:image:alt": "Monogram R & A — undangan ngunduh mantu",
        "theme-color": "#520809"
      }
    }
  </script>

  <!-- Brand mark R & A — di-generate oleh `pnpm run icons` -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#FFFDFB">
  <meta name="apple-mobile-web-app-title" content="R & A">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
